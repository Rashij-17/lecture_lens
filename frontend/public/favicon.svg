<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Modern Vibrant Gradient matching app theme -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Camera Focus / Lens Brackets (Lens theme) -->
  <path d="M 22 14 L 14 14 L 14 22" stroke="url(#accentGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M 78 14 L 86 14 L 86 22" stroke="url(#accentGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M 22 86 L 14 86 L 14 78" stroke="url(#accentGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M 78 86 L 86 86 L 86 78" stroke="url(#accentGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- Outer Lens Circular Track -->
  <circle cx="50" cy="50" r="38" stroke="url(#accentGrad)" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="4 8"/>
  <circle cx="50" cy="50" r="33" stroke="url(#accentGrad)" stroke-width="2" fill="none" filter="url(#glow)"/>

  <!-- Aperture Blades (Sleek minimalist lines) -->
  <path d="M 50 17 L 54 24" stroke="url(#accentGrad)" stroke-width="1" opacity="0.7"/>
  <path d="M 83 50 L 76 54" stroke="url(#accentGrad)" stroke-width="1" opacity="0.7"/>
  <path d="M 50 83 L 46 76" stroke="url(#accentGrad)" stroke-width="1" opacity="0.7"/>
  <path d="M 17 50 L 24 46" stroke="url(#accentGrad)" stroke-width="1" opacity="0.7"/>

  <!-- Graduation Cap (Diamond Top) -->
  <polygon points="50,28 68,35 50,42 32,35" fill="url(#accentGrad)" filter="url(#glow)"/>
  
  <!-- Tassel -->
  <path d="M 68 35 L 72 41 L 72 47" stroke="url(#accentGrad)" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <circle cx="72" cy="49" r="1.5" fill="url(#accentGrad)" />

  <!-- Open Book (Cap Base) -->
  <path d="M 50 45 C 45 42, 38 42, 34 44 L 34 56 C 38 54, 45 54, 50 57 C 55 54, 62 54, 66 56 L 66 44 C 62 42, 55 42, 50 45 Z" 
        fill="url(#glowGrad)" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Book Details / Lines (Pages) -->
  <path d="M 39 49 C 42 48, 45 48, 47 49" stroke="url(#accentGrad)" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 61 49 C 58 48, 55 48, 53 49" stroke="url(#accentGrad)" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.8"/>
</svg>